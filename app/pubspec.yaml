name: app
description: "EcoConnect - resident app of the EcoTrack waste collection system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.0.2
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  http: ^1.6.0
  geolocator: ^12.0.0
  jwt_decoder: ^2.0.1

  # Shared geofencing contract with the EcoDispatch collector app (local,
  # pure Dart, no third-party dependencies).
  geofence_contract:
    path: ../packages/geofence_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21